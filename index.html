          <div class="answer-body">
            <p>多格列艾汀（Dorzagliatin），商品名为<strong>华堂宁®</strong>，是由华领医药自主研发并全球首个获批上市的<strong>双重葡萄糖激酶（GK）激活剂</strong>。作为一种具有全新作用机制的口服降糖药物，它通过靶向人体自身的“葡萄糖传感器”——葡萄糖激酶（GK），旨在<strong>重塑2型糖尿病（T2DM）患者的血糖稳态生理调节机制</strong> <a class="citation" href="#source-1">▧</a>。</p>
            <h2>1. 核心定义与靶点机制</h2>
            <p>在生理状态下，GK主要分布于胰岛β细胞、α细胞、肠道内分泌细胞及肝脏中，充当“葡萄糖传感器”的角色，负责感知血糖浓度变化并调控胰岛素、胰高血糖素及GLP-1的分泌，同时调节肝糖原的合成与分解 <a class="citation" href="#source-2">▧</a>。2型糖尿病患者体内GK的表达量和活性显著下降（胰岛β细胞和肝脏细胞中GK表达量下降约40%，肝脏细胞中GK活性下降约50%），导致“传感器”失灵，引发胰岛素分泌缺陷（尤其是早相分泌缺失）和肝糖输出过多 <a class="citation" href="#source-2">▧</a>。</p>
            <p>多格列艾汀作为<strong>异位变构GK全激活剂</strong>，通过“葡萄糖浓度依赖”的方式结合于GK的活性调节点，修复受损GK的活性与构象，使其恢复对血糖波动的敏感性，从而重建血糖稳态的生理调节环路 <a class="citation" href="#source-3">▧</a>。</p>
            <h2>2. 多器官协同的“重塑”作用</h2>
            <p>多格列艾汀的独特之处在于其<strong>双重作用（胰腺+肝脏）与肠道协同</strong>，实现全方位、生理性的血糖调控：</p>
            <ul>
              <li><strong>胰岛作用：</strong>激活胰岛β细胞GK，恢复葡萄糖刺激的胰岛素分泌（GSIS）阈值，特别是修复关键的<strong>胰岛素早相分泌</strong>（餐后0-30分钟），这是控制餐后血糖峰值的关键。同时调节GLP-1分泌，改善β细胞功能并降低胰岛素抵抗 <a class="citation" href="#source-2">▧</a>。</li>
              <li><strong>肝脏作用：</strong>在餐后高血糖状态下（&gt;10 mmol/L），激活肝细胞GK，促进葡萄糖磷酸化及糖原合成，抑制肝糖输出，有效降低空腹血糖 <a class="citation" href="#source-2">▧</a>。</li>
              <li><strong>肠道作用：</strong>激活肠道内分泌细胞GK，促进GLP-1分泌，进一步放大促胰岛素分泌作用 <a class="citation" href="#source-2">▧</a>。</li>
            </ul>
            <h2>3. 临床适应症与获批情况</h2>
            <p>多格列艾汀于2022年9月30日获得中国国家药品监督管理局（NMPA）批准上市 <a class="citation" href="#source-1">▧</a>。其获批适应症包括：</p>
            <ul>
              <li><strong>单药治疗：</strong>配合饮食控制和运动，改善成人2型糖尿病患者的血糖控制。</li>
              <li><strong>联合治疗：</strong>在单独使用盐酸二甲双胍血糖控制不佳时，可与盐酸二甲双胍联合使用，配合饮食和运动改善成人2型糖尿病患者的血糖控制 <a class="citation" href="#source-1">▧</a>。</li>
              <li><strong>禁忌症：</strong>本品不适用于治疗1型糖尿病、糖尿病酮症酸中毒或高血糖高渗状态 <a class="citation" href="#source-1">▧</a>。</li>
            </ul>
            <h2>4. 临床获益与安全性</h2>
            <ul>
              <li><strong>全面降糖：</strong>临床试验显示，多格列艾汀不仅能显著降低糖化血红蛋白（HbA1c），对空腹血糖和餐后血糖均有改善作用，其中对餐后血糖的降低尤为显著 <a class="citation" href="#source-2">▧</a>。</li>
              <li><strong>改善β细胞功能：</strong>多项研究证实，多格列艾汀可改善胰岛素早相分泌，提高HOMA2-β指数，具有保护β细胞功能的潜力 <a class="citation" href="#source-2">▧</a>。</li>
              <li><strong>糖尿病缓解潜力：</strong>DREAM研究（SEED研究的拓展研究）显示，经多格列艾汀治疗血糖达标后停药，部分患者在52周内实现了糖尿病缓解（概率达65.2%），提示其在重塑血糖稳态、实现疾病缓解方面具有独特优势 <a class="citation" href="#source-4">▧</a>。</li>
              <li><strong>安全性特征：</strong>因其葡萄糖浓度依赖机制，低血糖风险极低，临床试验中未报告严重低血糖事件。常见的不良反应包括轻度、一过性的肝酶升高、甘油三酯升高或尿酸升高，通常不随治疗时间延长而加重 <a class="citation" href="#source-1">▧</a>。</li>
              <li><strong>特殊人群适用性：</strong>多格列艾汀主要经肝脏代谢，肾功能不全患者（包括终末期肾脏病未透析患者）无需调整剂量；轻度肝功能损害患者也无需调整剂量，但中重度肝功能损害患者不推荐使用 <a class="citation" href="#source-1">▧</a>。</li>
            </ul>

    const addMindMapCard = (turn, kind = 'pdf') => {
      const card = document.createElement('div');
      card.className = 'generated-file-card';
      card.dataset.kind = kind;
      const preview = document.createElement('div');
      preview.className = 'mindmap-preview';
      const previewImage = document.createElement('img');

      const regenerate = document.createElement('button');
      regenerate.className = 'regenerate-pdf';
      regenerate.type = 'button';
      regenerate.textContent = `重新生成${isPpt ? 'PPT' : 'PDF'}`;
      info.append(filename, status, regenerate);
      const download = document.createElement('a');
      download.className = 'download-pdf';
      download.download = filenameText;
      download.innerHTML = `<span aria-hidden="true">⇩</span>下载${isPpt ? 'PPT' : 'PDF'}`;
      card.append(preview, info, download);
      const file = createFile();
      download.href = isPpt ? file.pptUrl : file.pdfUrl;
      download.dataset.objectUrl = download.href;
      previewImage.src = file.previewUrl;
      turn.appendChild(card);
      requestAnimationFrame(() => card.scrollIntoView({ block: 'center', behavior: 'smooth' }));
    };
    const sendQuestion = () => {
      const question = input.value.trim();
      if (!question) { input.focus(); return; }
      const turn = document.createElement('section');
      turn.className = 'conversation-turn';
      const questionBubble = document.createElement('div');
      questionBubble.className = 'sent-question';
      questionBubble.textContent = question;
      turn.appendChild(questionBubble);
      turn.appendChild(answerTemplate.content.cloneNode(true));
      conversationThread.appendChild(turn);
      welcomeView.hidden = true;
      document.querySelector('.topbar span').textContent = question;
      input.value = '';
      requestAnimationFrame(() => turn.scrollIntoView({ block: 'start', behavior: 'smooth' }));
    };
    const appShell = document.querySelector('.app-shell');
    const recommendToggle = document.querySelector('#recommend-toggle');
    const updateRecommendationLabels = () => {
      const isOpen = appShell.classList.contains('recommendations-open');
      recommendToggle.setAttribute('aria-expanded', String(isOpen));
      conversationThread.querySelectorAll('.sources-actions [data-prompt=""]').forEach((button) => {
        button.textContent = isOpen ? '收起推荐提问' : '查看推荐提问';
      });
    };
    const recommendButtons = [...document.querySelectorAll('.recommend-item')];
    const recommendationBatches = [
      [
        '什么是多格列艾汀？',
        '多格列艾汀的血糖稳态作用机制？',
        '多格列艾汀的推荐用法用量是多少？',
        '肾功能不全患者如何使用多格列艾汀？',
        '多格列艾汀与二甲双胍联用有哪些注意事项？',
        '多格列艾汀常见的不良反应有哪些？'
      ],
      [
        '多格列艾汀的作用机制是什么？',
        '多格列艾汀的临床研究主要疗效结果是什么？',
        '多格列艾汀对餐后血糖有什么影响？',
        '多格列艾汀如何改善胰岛β细胞功能？',
        '多格列艾汀的安全性如何？',
        '多格列艾汀适用于哪些患者？'
      ]
    ];
    let recommendationBatch = 0;
    document.querySelector('#shuffle-recommendations').addEventListener('click', () => {
      recommendationBatch = (recommendationBatch + 1) % recommendationBatches.length;
      recommendButtons.forEach((button, index) => {
        const question = recommendationBatches[recommendationBatch][index];
        button.dataset.question = question;
        button.querySelector('.index').textContent = String(index + 1).padStart(2, '0');
        button.querySelector('span:not(.index)').textContent = question;
      });
    });
    recommendToggle.addEventListener('click', () => {
      appShell.classList.toggle('recommendations-open');
      updateRecommendationLabels();
    });
    conversationThread.addEventListener('click', (event) => {
      const generationButton = event.target.closest('[data-action="generate-mindmap"], [data-action="generate-ppt"]');
      if (generationButton) {
        const turn = generationButton.closest('.conversation-turn');
        const kind = generationButton.dataset.action === 'generate-ppt' ? 'ppt' : 'pdf';
        const existingCard = turn.querySelector(`.generated-file-card[data-kind="${kind}"]`);
        if (existingCard) existingCard.querySelector('.regenerate-pdf').click();
        else addMindMapCard(turn, kind);
        return;
      }
      const regenerateButton = event.target.closest('.regenerate-pdf');
      if (regenerateButton) {
        const card = regenerateButton.closest('.generated-file-card');
        const download = card.querySelector('.download-pdf');
        if (download.dataset.objectUrl) URL.revokeObjectURL(download.dataset.objectUrl);
        const isPpt = card.dataset.kind === 'ppt';
        const file = isPpt ? makeMindMapPpt() : makeMindMapPdf();
        download.href = isPpt ? file.pptUrl : file.pdfUrl;
        download.dataset.objectUrl = download.href;
        card.querySelector('.mindmap-preview img').src = file.previewUrl;
        card.querySelector('.generated-file-status').innerHTML = `<strong>✓</strong>${isPpt ? 'PPT' : 'PDF'}已重新生成，可下载查看`;
        return;
      }
      const expandButton = event.target.closest('.expand-all');
      if (expandButton) {
        const sources = expandButton.closest('.sources');
        const expanded = sources.classList.toggle('expanded');
        expandButton.setAttribute('aria-expanded', String(expanded));
        expandButton.textContent = expanded ? '收起⌃' : '全部展开⌄';
        return;
      }
      const actionButton = event.target.closest('[data-prompt]');
      if (actionButton) {
        if (actionButton.dataset.prompt) {
          input.value = actionButton.dataset.prompt;
          input.focus();
        } else {
          appShell.classList.toggle('recommendations-open');
          updateRecommendationLabels();
        }
      }
    });
    document.querySelectorAll('[data-question]').forEach((button) => {
      button.addEventListener('click', () => {
        input.value = button.dataset.question;
        input.focus();
      });
    });
    document.querySelector('#composer').addEventListener('submit', (event) => {
      event.preventDefault();
      sendQuestion();
    });
    document.querySelector('#send-button').addEventListener('click', (event) => {
      event.preventDefault();
      sendQuestion();
    });
    document.querySelector('.new-chat').addEventListener('click', () => {
      input.value = '';
      conversationThread.replaceChildren();
      welcomeView.hidden = false;
      document.querySelector('#composer').hidden = false;
      document.querySelector('.topbar span').textContent = '新对话';
      appShell.classList.remove('recommendations-open');
      updateRecommendationLabels();
      document.querySelector('.main-content').scrollTop = 0;
    });
    document.querySelector('.clean').addEventListener('click', () => {
      document.querySelectorAll('.chat-list .chat-item:not(.active)').forEach(item => item.remove());
      document.querySelector('.loaded').textContent = '暂无历史对话';
    });
  </script>
